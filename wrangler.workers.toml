# wrangler.workers.toml - Cloudflare Workers Configuration for R2 Cache
# Verzija: 3.0.0 - Separate Workers deployment
# Deploy this worker separately: wrangler deploy --config wrangler.workers.toml
# SECURITY: Account ID i Zone ID su sada u .env.local

name = "vaga-beta-r2-worker"

# SECURITY: Uklonio account_id iz ovog fajla
# Cloudflare CLI će ga pročitati iz auth ili .env.local
# account_id = "your_account_id" # NE DODAJ OVDE!

main = "src/workers/r2-cache-worker.js"
workers_dev = true
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# R2 Bucket Configuration
[[r2_buckets]]
bucket_name = "vaga-beta-cache"
binding = "R2_BUCKET"
jurisdiction = "eu"

[[r2_buckets]]
bucket_name = "vaga-beta-cache"
binding = "R2_CDN"
jurisdiction = "eu"

# KV Namespace for cache metadata
[[kv_namespaces]]
binding = "CACHE_METADATA"


# Analytics Engine binding
[[analytics_engine_datasets]]
binding = "ANALYTICS"

# Production environment
# SECURITY: Zone ID i routes su uklonjeni - dodaj samo u .env.local!
[env.production]
name = "vaga-beta-r2-production"
workers_dev = false
vars = { ENVIRONMENT = "production", CORS_ORIGIN = "https://vagabeta.rs", MAX_FILE_SIZE = "104857600" }

# routes = [
#   { pattern = "https://cache.your-domain.com/*", zone_id = "YOUR_ZONE_ID" },
#   { pattern = "https://cdn.your-domain.com/*", zone_id = "YOUR_ZONE_ID" }
# ]
# Za production routes, konfiguriši ih direktno u Cloudflare Dashboard
# ili dodaj zone_id u .env.local i učitaj preko wrangler CLI

[[env.production.r2_buckets]]
bucket_name = "vaga-beta-cache"
binding = "R2_BUCKET"
jurisdiction = "eu"

[[env.production.r2_buckets]]
bucket_name = "vaga-beta-cache"
binding = "R2_CDN"
jurisdiction = "eu"

[[env.production.kv_namespaces]]
binding = "CACHE_METADATA"
id = "2bb2f5778aaa459382c4731b60f3405a"

[[env.production.analytics_engine_datasets]]
binding = "ANALYTICS"

# Development environment
[env.development]
name = "vaga-beta-r2-development"
workers_dev = true

vars = { ENVIRONMENT = "development", DEBUG = "true" }

[[env.development.r2_buckets]]
bucket_name = "vaga-beta-cache"
binding = "R2_BUCKET"
jurisdiction = "eu"

[[env.development.kv_namespaces]]
binding = "CACHE_METADATA"
id = "2bb2f5778aaa459382c4731b60f3405a"

# Environment variables
[vars]
ENVIRONMENT = "production"
CORS_ORIGIN = "https://vagabeta.rs"
MAX_FILE_SIZE = "104857600"
